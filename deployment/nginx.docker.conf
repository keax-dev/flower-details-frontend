worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Log paths without query strings, headers, cookies or request bodies.
    log_format testing escape=json '{"time":"$time_iso8601","requestId":"$request_id","method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,"duration":$request_time,"upstreamDuration":"$upstream_response_time"}';
    access_log /dev/stdout testing;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;

    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream api {
        zone api 64k;
        server app:8080 resolve;
        keepalive 16;
    }

    server {
        listen 8081;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 25m;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; form-action 'self'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self' data:;" always;
        add_header X-Request-Id $request_id always;

        location = /healthz { access_log off; return 200 "ok\n"; }
        location ^~ /api/ { include /etc/nginx/api-proxy.conf; }
        location ~ ^/(swagger-ui(/|\.html)|v3/api-docs(/|$)) { include /etc/nginx/api-proxy.conf; }
        # Metrics retain the backend ADMIN authorization checks.
        location ~ ^/actuator/(health|metrics)(/|$) { include /etc/nginx/api-proxy.conf; }
        location /actuator/ { return 404; }
        location ~ (^|/)\. { return 404; }
        location ~* \.(map|env|log|pem|key|p12|pfx|tgz|ts)$ { return 404; }
        location ~* ^/(package(-lock)?\.json|angular\.json|tsconfig[^/]*\.json)$ { return 404; }
        location ^~ /src/ { return 404; }
        location = /index.html { expires -1; }
        location ~* "/[^/]+-[a-z0-9_-]{6,}\.(js|css|woff2?)$" {
            try_files $uri =404;
            expires 1y;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
