# Static frontend on 8081; the same-host Spring API listens on 8080.
# Terminate HTTPS at the trusted reverse proxy in front of this server.
events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    server {
        listen 8081;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 25m;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        # Angular's generated index.html supplies the hash-based script policy.
        add_header Content-Security-Policy "frame-ancestors 'none'; form-action 'self'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self' data:;" always;

        location ^~ /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ (^|/)\. { return 404; }
        location ~* \.(map|env|log|pem|key|p12|pfx|tgz|ts)$ { return 404; }
        location ~* ^/(package(-lock)?\.json|angular\.json|tsconfig[^/]*\.json)$ { return 404; }
        location ^~ /src/ { return 404; }
        location = /index.html { expires -1; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
