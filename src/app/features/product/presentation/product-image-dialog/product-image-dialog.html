<nz-modal
  (nzOnCancel)="closed.emit()"
  [nzFooter]="footer"
  [nzTitle]="'Imágenes de ' + product().title"
  [nzVisible]="isOpen()"
>
  <ng-container *nzModalContent>
    <div class="container-fluid px-0">
      <div class="row g-4">
        <div class="col-12">
          <p class="product-image-dialog__description mb-3">
            Selecciona imágenes JPG, PNG o WEBP. Podrás revisar la selección antes de guardarla.
          </p>
          <nz-upload
            [nzBeforeUpload]="queueImage"
            [nzAccept]="acceptedImageTypes"
            [nzFileList]="fileList"
            [nzDownload]="downloadImage"
            [nzDisabled]="isUploading()"
            [nzIconRender]="fileIcon"
            [nzMultiple]="false"
            [nzRemove]="removeQueuedImage"
            [nzShowUploadList]="{
              showPreviewIcon: false,
              showDownloadIcon: true,
              showRemoveIcon: true,
              downloadIcon: downloadIcon,
              removeIcon: removeIcon
            }"
            nzListType="picture-card"
          >
            <button class="btn btn-outline-success" type="button">
              <fa-icon [icon]="faUpload" aria-hidden="true" />
              Añadir imagen
            </button>
          </nz-upload>
        </div>

        @if (product().images.length > 0) {
          <div class="col-12">
            <h3 class="product-image-dialog__title">Imágenes actuales</h3>
            <div class="row g-3">
              @for (image of product().images; track image.id) {
                <div class="col-6 col-md-4">
                  <img [alt]="image.originalFileName" [src]="image.url" class="product-image-dialog__image" />
                </div>
              }
            </div>
          </div>
        }
      </div>
    </div>
  </ng-container>
</nz-modal>

<ng-template #fileIcon>
  <fa-icon [icon]="faImage" aria-hidden="true" />
</ng-template>

<ng-template #removeIcon>
  <fa-icon [icon]="faTrash" aria-hidden="true" class="text-white" />
</ng-template>

<ng-template #downloadIcon>
  <fa-icon [icon]="faDownload" aria-hidden="true" class="text-white" />
</ng-template>

<ng-template #footer>
  <div class="d-flex justify-content-end gap-2">
    <button (click)="closed.emit()" [disabled]="isUploading()" class="btn btn-sm btn-outline-dark px-3" type="button">
      <fa-icon [icon]="faXmark" aria-hidden="true" />
      Cancelar
    </button>
    <button
      (click)="saveImages()"
      [disabled]="isUploading() || fileList.length === 0"
      class="btn btn-sm btn-success px-4"
      type="button"
    >
      <fa-icon [icon]="faFloppyDisk" aria-hidden="true" />
      {{ isUploading() ? 'Guardando...' : 'Guardar' }}
    </button>
  </div>
</ng-template>
