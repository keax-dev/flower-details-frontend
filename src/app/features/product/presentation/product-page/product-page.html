<main class="product-page py-4 py-md-5">
  <div class="container-fluid product-page__container">
    <header class="row align-items-center gy-3 product-page__header">
      <div class="col-12 col-md">
        <p class="product-page__eyebrow mb-2">Administración</p>
        <h1 class="product-page__title mb-0">Productos</h1>
      </div>
      <div class="col-12 col-md-auto">
        <button (click)="openCreateForm()" class="btn btn-sm btn-success" type="button">
          <fa-icon [icon]="faPlus" aria-hidden="true" />
          Nuevo producto
        </button>
      </div>
    </header>

    <div class="row mt-4 mt-md-5">
      <div class="col-12">
        <app-product-list [refreshVersion]="listRefreshVersion()" (edit)="openEditForm($event)" (manageImages)="openImageManager($event)" />
      </div>
    </div>

    <app-product-form-dialog (closed)="closeForm()" (saved)="handleProductSaved($event)" [product]="editingProduct()" [isOpen]="isFormVisible()" />

    @if (imageProduct(); as product) {
      <app-product-image-dialog
        (closed)="closeImageManager()"
        (uploaded)="handleImagesUploaded($event)"
        [isOpen]="isImageManagerVisible()"
        [product]="product"
      />
    }
  </div>
</main>
