<nz-modal
  (nzOnCancel)="closed.emit()"
  (nzOnOk)="submit()"
  [nzCancelDisabled]="isSaving()"
  [nzOkDisabled]="isSaving()"
  [nzOkLoading]="isSaving()"
  [nzTitle]="category() ? 'Actualizar categoría' : 'Crear categoría'"
  [nzVisible]="isOpen()"
  nzCancelText="Cancelar"
  nzOkText="Guardar categoría"
>
  <ng-container *nzModalContent>
    <form [formGroup]="categoryForm" novalidate>
      <div class="container-fluid px-0">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label" for="category-title">Título</label>
            <input
              [class.is-invalid]="hasError('title')"
              formControlName="title"
              id="category-title"
              maxlength="120"
              nz-input
              type="text"
            />
            @if (hasError('title')) {
              <div class="invalid-feedback">El título es obligatorio.</div>
            }
          </div>
          <div class="col-12">
            <label class="form-label" for="category-description">Descripción</label>
            <textarea
              [class.is-invalid]="hasError('description')"
              formControlName="description"
              id="category-description"
              maxlength="500"
              nz-input
              rows="4"
            ></textarea>
            @if (hasError('description')) {
              <div class="invalid-feedback">La descripción es obligatoria.</div>
            }
          </div>
          <div class="col-12">
            <label formControlName="active" nz-checkbox>Categoría activa</label>
          </div>
        </div>
      </div>
    </form>
  </ng-container>
</nz-modal>
