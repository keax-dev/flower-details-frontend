<nz-modal (nzOnCancel)="closed.emit()" [nzFooter]="footer" [nzTitle]="category() ? 'Actualizar categoría' : 'Crear categoría'" [nzVisible]="isOpen()">
  <ng-container *nzModalContent>
    <form [formGroup]="categoryForm" novalidate>
      <div class="container-fluid px-0">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label" for="category-title">Título</label>
            <input [class.is-invalid]="hasError('title')" formControlName="title" id="category-title" maxlength="120" nz-input type="text" />
            @if (hasError('title')) {
              <div class="invalid-feedback">El título es obligatorio.</div>
            }
          </div>
          <div class="col-12">
            <span class="form-label d-block">Descripción</span>
            <quill-editor
              [class.is-invalid]="hasError('description')"
              [formats]="richTextFormats"
              [maxLength]="descriptionMaxLength"
              [modules]="richTextModules"
              [required]="true"
              [sanitize]="true"
              formControlName="description"
              id="category-description"
              placeholder="Describe la categoría"
            />
            @if (hasError('description')) {
              <div class="form-validation-message text-danger small mt-1">La descripción es obligatoria y no puede superar 500 caracteres.</div>
            }
          </div>
          <div class="col-12">
            <!-- eslint-disable-next-line @angular-eslint/template/label-has-associated-control -->
            <label formControlName="active" nz-checkbox>Categoría activa</label>
          </div>
        </div>
      </div>
    </form>
  </ng-container>
</nz-modal>

<ng-template #footer>
  <div class="d-flex justify-content-end gap-2">
    <button (click)="closed.emit()" [disabled]="isSaving()" class="btn btn-sm btn-dark px-3" type="button">
      <fa-icon [icon]="faXmark" aria-hidden="true" />
      Cancelar
    </button>
    <button (click)="submit()" [disabled]="isSaving()" class="btn btn-sm btn-success px-4" type="button">
      <fa-icon [icon]="faFloppyDisk" aria-hidden="true" />
      {{ isSaving() ? 'Guardando...' : 'Guardar' }}
    </button>
  </div>
</ng-template>
