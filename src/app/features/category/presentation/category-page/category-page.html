<main class="category-page py-4 py-md-5">
  <div class="container-fluid category-page__container">
    <header class="row align-items-center gy-3 category-page__header">
      <div class="col-12 col-md">
        <p class="category-page__eyebrow mb-2">Administración</p>
        <h1 class="category-page__title mb-0">Categorías</h1>
      </div>
      <div class="col-12 col-md-auto">
        <button (click)="openCreateForm()" class="btn btn-sm btn-success" type="button">
          <fa-icon [icon]="faPlus" aria-hidden="true" />
          Nueva categoría
        </button>
      </div>
    </header>

    <div class="row mt-4 mt-md-5">
      <div class="col-12">
        <app-category-list [refreshVersion]="listRefreshVersion()" (edit)="openEditForm($event)" />
      </div>
    </div>

    <app-category-form-dialog
      (closed)="closeForm()"
      (saved)="refreshList()"
      [category]="editingCategory()"
      [isOpen]="isFormVisible()"
    />
  </div>
</main>
