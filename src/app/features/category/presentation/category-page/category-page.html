<main
  class="min-h-dvh bg-background px-6 py-6 text-foreground sm:px-12 lg:px-[clamp(3rem,7vw,8rem)] lg:py-8"
>
  <header class="flex flex-wrap items-center justify-between gap-4 border-b border-border pb-5">
    <div>
      <p class="text-xs font-bold tracking-[0.16em] text-primary uppercase">Administración</p>
      <h1 class="mt-2 font-serif text-3xl sm:text-4xl">Categorías</h1>
    </div>
    <button (click)="openCreateForm()" nz-button nzType="primary" type="button">
      <fa-icon [icon]="faPlus" aria-hidden="true" />
      Nueva categoría
    </button>
  </header>

  <div class="mt-8">
    <app-category-list [refreshVersion]="listRefreshVersion()" (edit)="openEditForm($event)" />
  </div>

  <app-category-form-dialog
    (closed)="closeForm()"
    (saved)="refreshList()"
    [category]="editingCategory()"
    [isOpen]="isFormVisible()"
  />
</main>
